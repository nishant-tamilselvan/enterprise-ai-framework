site_name: Enterprise AI Framework
site_description: Vendor-neutral Enterprise AI architecture for government, public-sector, and regulated organizations.
site_url: https://nishant-tamilselvan.github.io/enterprise-ai-framework/
repo_url: https://github.com/nishant-tamilselvan/enterprise-ai-framework
repo_name: nishant-tamilselvan/enterprise-ai-framework
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 NISHANT TAMILSELVAN and contributors. Licensed under CC BY 4.0.

strict: true

not_in_nav: |
  /blog/templates/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: blog/posts
      post_date_format: full
      archive: true
      categories: true
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Context Architecture: architecture/context-architecture.md
      - ECA × TOGAF ADM: architecture/eca-togaf-adm.md
      - Capability Model: architecture/capability-model.md
      - Integration Layer: architecture/integration-layer.md
      - Reference Diagrams: architecture/reference-diagrams.md
  - Governance:
      - Overview: governance/overview.md
      - Operating Model: governance/operating-model.md
      - Risk Management: governance/risk-management.md
      - Policies: governance/policies.md
  - Security:
      - Overview: security/overview.md
      - Zero-Trust AI: security/zero-trust-ai.md
      - Data Protection: security/data-protection.md
      - Threat Model: security/threat-model.md
  - Compliance:
      - Overview: compliance/overview.md
      - NIST AI RMF: compliance/nist-ai-rmf-mapping.md
      - ISO/IEC 42001: compliance/iso-iec-42001-mapping.md
      - EU AI Act: compliance/eu-ai-act-mapping.md
      - FedRAMP: compliance/fedramp-mapping.md
      - Control Mapping Template: compliance/templates/control-mapping-template.md
  - Blueprints:
      - Overview: blueprints/overview.md
      - Public-Sector RAG: blueprints/public-sector-rag-blueprint.md
      - Regulated Enterprise: blueprints/regulated-enterprise-blueprint.md
  - Blog: blog/index.md
  - Glossary: glossary.md
