<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Enterprise AI Framework">
  <title>Enterprise AI Framework</title>
  <!-- Rounded indigo tile so the mark reads well as a browser-tab favicon -->
  <rect width="48" height="48" rx="10" fill="#3f51b5"/>
  <!-- Outer context ring -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.55"/>
  <!-- Spokes -->
  <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <line x1="24" y1="24" x2="38" y2="24"/>
    <line x1="24" y1="24" x2="31" y2="11.88"/>
    <line x1="24" y1="24" x2="17" y2="11.88"/>
    <line x1="24" y1="24" x2="10" y2="24"/>
    <line x1="24" y1="24" x2="17" y2="36.12"/>
    <line x1="24" y1="24" x2="31" y2="36.12"/>
  </g>
  <!-- Context domain nodes -->
  <g fill="#ffffff">
    <circle cx="38" cy="24" r="2.4"/>
    <circle cx="31" cy="11.88" r="2.4"/>
    <circle cx="17" cy="11.88" r="2.4"/>
    <circle cx="10" cy="24" r="2.4"/>
    <circle cx="17" cy="36.12" r="2.4"/>
    <circle cx="31" cy="36.12" r="2.4"/>
  </g>
  <!-- Centre -->
  <circle cx="24" cy="24" r="4.8" fill="#ffffff"/>
  <circle cx="24" cy="24" r="2.2" fill="#3f51b5"/>
</svg>
