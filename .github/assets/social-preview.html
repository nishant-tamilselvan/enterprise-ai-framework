<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; }
  body {
    font-family: Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 84% 50%, rgba(255,255,255,.16), rgba(255,255,255,0) 42%),
      linear-gradient(135deg, #283593 0%, #3f51b5 58%, #5c6bc0 100%);
    position: relative; overflow: hidden;
  }
  .content { position: absolute; left: 80px; top: 96px; width: 820px; }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 34px; }
  .brand span { font-size: 26px; font-weight: 500; letter-spacing: .5px; opacity: .9; }
  h1 { margin: 0 0 22px; font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -2px; }
  p { margin: 0 0 40px; font-size: 30px; line-height: 1.35; opacity: .92; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chips span { padding: 8px 16px; border: 2px solid rgba(255,255,255,.55); border-radius: 999px; font-size: 20px; font-weight: 500; }
  .wheel { position: absolute; right: 70px; top: 120px; }
  .url { position: absolute; left: 80px; bottom: 38px; font-size: 20px; opacity: .7; letter-spacing: .3px; }
</style>
</head>
<body>
  <div class="content">
    <div class="brand">
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="20" stroke="#fff" stroke-width="1.4" opacity=".55"/>
        <g stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".85">
          <line x1="24" y1="24" x2="44" y2="24"/><line x1="24" y1="24" x2="34" y2="6.68"/><line x1="24" y1="24" x2="14" y2="6.68"/>
          <line x1="24" y1="24" x2="4" y2="24"/><line x1="24" y1="24" x2="14" y2="41.32"/><line x1="24" y1="24" x2="34" y2="41.32"/>
        </g>
        <g fill="#fff"><circle cx="44" cy="24" r="3"/><circle cx="34" cy="6.68" r="3"/><circle cx="14" cy="6.68" r="3"/>
          <circle cx="4" cy="24" r="3"/><circle cx="14" cy="41.32" r="3"/><circle cx="34" cy="41.32" r="3"/></g>
        <circle cx="24" cy="24" r="6.5" fill="#fff"/><circle cx="24" cy="24" r="3" fill="#3f51b5"/>
      </svg>
      <span>Open framework · CC BY 4.0</span>
    </div>
    <h1>Enterprise AI Framework</h1>
    <p>Vendor-neutral architecture for government, public&#8209;sector, and regulated organizations.</p>
    <div class="chips">
      <span>Context architecture</span><span>Governance</span><span>Security</span><span>Compliance mappings</span>
    </div>
  </div>
  <svg class="wheel" width="400" height="400" viewBox="-200 -200 400 400" fill="none" stroke="#fff" stroke-linecap="round">
    <circle r="170" stroke-width="2.5" opacity=".18"/>
    <circle r="112" stroke-width="2.5" opacity=".28"/>
    <g stroke-width="3" opacity=".5">
      <line x2="0" y2="-170"/><line x2="132.9" y2="-106"/><line x2="165.7" y2="37.8"/><line x2="73.8" y2="153.2"/>
      <line x2="-73.8" y2="153.2"/><line x2="-165.7" y2="37.8"/><line x2="-132.9" y2="-106"/>
    </g>
    <g fill="#fff" stroke="none" opacity=".92">
      <circle cy="-170" r="14"/><circle cx="132.9" cy="-106" r="14"/><circle cx="165.7" cy="37.8" r="14"/><circle cx="73.8" cy="153.2" r="14"/>
      <circle cx="-73.8" cy="153.2" r="14"/><circle cx="-165.7" cy="37.8" r="14"/><circle cx="-132.9" cy="-106" r="14"/>
    </g>
    <circle r="44" fill="#fff" stroke="none"/><circle r="19" fill="#3f51b5" stroke="none"/>
  </svg>
  <div class="url">nishant-tamilselvan.github.io/enterprise-ai-framework</div>
</body>
</html>
